name: 构建并发布 Docker 镜像

# 触发条件：
#   1. 推送到 master 分支 -> 打 latest + sha 标签
#   2. 推送 v* 版本 tag   -> 打语义化版本标签（1.2.3 / 1.2 / 1）
#   3. 手动在 Actions 页面触发
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# 推送镜像到 ghcr.io 需要 packages:write；读取源码需要 contents:read
permissions:
  contents: read
  packages: write

env:
  # 镜像名必须小写；docker/metadata-action 会自动小写化 owner 部分
  IMAGE_NAME: openwebtts

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成镜像标签与 OCI 标签：
      #   - master 推送: latest, sha-xxxxxxx
      #   - v1.2.3 tag: 1.2.3, 1.2, 1, sha-xxxxxxx
      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions 缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
